# SiC Lab CI template for Python repositories.
# Template docs: https://docs.github.com/en/actions/how-tos/reuse-automations/create-workflow-templates
# Workflow syntax: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Actions are pinned to full-length commit SHAs, as GitHub recommends:
# https://docs.github.com/en/actions/reference/security/secure-use
#
# Set the matrix to the oldest Python you support and the newest one.
# If tests use pytest with a "test" extra in pyproject.toml, keep the Install and Test steps as they are.
# For a standard-library-only project, delete the Install step and use: python -m unittest
name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

# Read-only token. Nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e '.[test]'

      - name: Test
        run: python -m pytest -q
